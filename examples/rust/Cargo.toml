[package]
name = "multipong_client"
version = "0.1.0"
edition = "2021"
description = "Minimal MultiPong WebSocket client (Bevy-ready protocol demo)"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
