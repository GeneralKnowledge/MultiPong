[package]
name = "multipong_client"
version = "0.1.0"
edition = "2021"
description = "Polished MultiPong WebSocket client (macroquad + authoritative server)"

[dependencies]
macroquad = "0.4"
pong_sim = { path = "../../reference/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.24", default-features = true, features = ["handshake"] }
