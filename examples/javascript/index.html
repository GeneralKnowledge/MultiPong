<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MultiPong</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0e14;
      --panel: #121722;
      --line: #2a3344;
      --text: #f2f5f8;
      --muted: #8b95a8;
      --accent: #7fd0c5;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(ellipse 900px 500px at 50% -10%, #1a2436 0%, transparent 60%),
        var(--bg);
      color: var(--text);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
    }
    .wrap {
      max-width: 860px;
      margin: 0 auto;
      padding: 20px 16px 32px;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px 16px;
      margin-bottom: 14px;
    }
    header h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: 0.08em;
    }
    header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.8rem;
    }
    .panel {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: end;
      margin-bottom: 12px;
      padding: 12px;
      background: var(--panel);
      border: 1px solid var(--line);
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    input {
      width: 160px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      font: inherit;
      font-size: 0.85rem;
    }
    input:focus {
      outline: 1px solid var(--accent);
      border-color: var(--accent);
    }
    button {
      padding: 8px 14px;
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--accent);
      font: inherit;
      font-size: 0.85rem;
      cursor: pointer;
    }
    button:hover { background: rgba(127, 208, 197, 0.12); }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .stage {
      position: relative;
      width: 800px;
      max-width: 100%;
      margin: 0 auto;
      border: 1px solid var(--line);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: var(--bg);
      vertical-align: top;
    }
    #status {
      margin-top: 10px;
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
    }
    .help {
      margin-top: 8px;
      font-size: 0.72rem;
      color: var(--muted);
      text-align: center;
    }
    @media (max-width: 840px) {
      .stage { width: 100%; }
      input { width: 100%; }
      .panel label { flex: 1 1 120px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>MULTIPONG</h1>
      <p>JS canvas client · authoritative server</p>
    </header>

    <form class="panel" id="join-form">
      <label>Name
        <input id="name" name="name" maxlength="32" value="js" autocomplete="username" />
      </label>
      <label>Room
        <input id="room" name="room" maxlength="32" value="demo" />
      </label>
      <label>Server
        <input id="url" name="url" value="ws://127.0.0.1:8765" spellcheck="false" />
      </label>
      <button type="submit" id="connect-btn">Connect</button>
      <button type="button" id="disconnect-btn" disabled>Disconnect</button>
    </form>

    <div class="stage">
      <canvas id="c" width="800" height="600" aria-label="Pong playfield"></canvas>
    </div>
    <div id="status">Not connected</div>
    <div class="help">W/S or ↑/↓ move · Enter confirm · P pause · R restart</div>
  </div>
  <script src="client.js"></script>
</body>
</html>
